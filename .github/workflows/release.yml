name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

# One release at a time; queue (don't cancel) any run that lands mid-release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Escape hatch for a commit that shouldn't cut a release (e.g. a manual fixup
    # push). Note this is a secondary safeguard: pushes made below using the
    # workflow's own GITHUB_TOKEN don't re-trigger `on: push` workflows at all,
    # so the version-bump commit itself can't cause a release loop.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(uv run python scripts/bump_version.py)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pydoublecross/__init__.py
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip release]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build distribution
        run: |
          rm -rf dist
          uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
