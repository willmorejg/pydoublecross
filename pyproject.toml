[project]
name = "pydoublecross"
version = "2026.7.1"
description = "Validate data consistency between two data sources (RDBMS today, S3/Iceberg/Databricks planned) using Great Expectations, with CLI, REST API, and web UI front ends."
readme = "README.md"
authors = [
    { name = "James G Willmore", email = "willmorejg@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["data-validation", "data-quality", "great-expectations", "etl", "reconciliation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "great-expectations>=1.3",
    "typer>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/willmorejg/pydoublecross"
Documentation = "https://github.com/willmorejg/pydoublecross"
Repository = "https://github.com/willmorejg/pydoublecross"

[project.scripts]
pydoublecross = "pydoublecross.cli.main:app"

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
oracle = ["oracledb>=2.4"]
duckdb = ["duckdb>=1.1", "duckdb-engine>=0.13"]
all = [
    "pyodbc>=5.1",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "oracledb>=2.4",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pydoublecross/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydoublecross"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pydoublecross"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pydoublecross --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pydoublecross"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
