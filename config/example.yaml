#
# pyDoubleCross configuration
#
# Secrets should never be stored in plaintext here — reference an environment
# variable instead with ${env:VAR_NAME}; it is substituted before parsing.
#
# Everything below `data_sources`/`validations` (excluding the commented-out
# section at the end) is file-based (SQLite/DuckDB) and requires no external
# server or credentials, so `pydoublecross validate-config -c config/example.yaml`
# and `pydoublecross run customer_count_check -c config/example.yaml` work
# out of the box — see docs/getting-started.md.

app:
  name: pyDoubleCross
  cache_dir: ~/.pydoublecross/cache
  results_dir: ~/.pydoublecross/results
  log_level: INFO

server:
  # 127.0.0.1 = only reachable from this machine. Set to 0.0.0.0 to expose it
  # on the network, and set server.api_key (or put it behind a reverse proxy)
  # if you do.
  host: 127.0.0.1
  port: 8000
  api_key: null

data_sources:
  # --- file-based, no server required, great for local testing ---
  legacy_sqlite:
    type: sqlite
    path: ./examples/legacy.db
    cache:
      enabled: true
      ttl_seconds: 3600

  warehouse_duckdb:
    type: duckdb
    path: ./examples/warehouse.duckdb
    cache:
      enabled: false

validations:
  customer_count_check:
    description: "Reconcile customer records between the legacy SQLite export and the DuckDB warehouse."
    source:
      data_source: legacy_sqlite
      sql: "SELECT customer_id, name, email, status FROM customers"
      # cache omitted here -> inherits legacy_sqlite's default (enabled, 1h TTL)
    target:
      data_source: warehouse_duckdb
      table: dim_customers
      cache:
        enabled: false  # override: never cache the target side, even though
                         # this data source's own default is cache-disabled anyway
    key_columns: [customer_id]
    compare_columns: [name, email, status]
    numeric_tolerance: 0.0
    expectations:
      row_count_match: true
      schema_match: true
      null_checks: true

